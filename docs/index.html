<style>
:root{
  --bg:#EDF6FB;
  --surface:rgba(255,255,255,0.78);
  --surface-h:rgba(255,255,255,0.96);
  --ocean:#15699A;
  --coral:#E0583A;
  --teal:#1A9E8F;
  --sand:#F5EEE0;
  --text:#162838;
  --muted:#5E8FA8;
  --border:rgba(21,105,154,0.13);
  --border-h:rgba(224,88,58,0.35);
  --blur:blur(14px);
  --r:12px;
  --hh:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans TC",sans-serif;
     background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh;overflow-x:hidden}

/* ── Background ── */
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse at 10% 20%,rgba(21,105,154,0.09) 0%,transparent 50%),
    radial-gradient(ellipse at 90% 70%,rgba(26,158,143,0.07) 0%,transparent 45%),
    radial-gradient(ellipse at 50% 100%,rgba(245,238,224,0.5) 0%,transparent 50%);
  pointer-events:none;z-index:-1;
  animation:bgShift 20s ease-in-out infinite alternate;
}
@keyframes bgShift{0%{opacity:.8}100%{opacity:1;transform:scale(1.02)}}

/* ── Header ── */
header{
  position:fixed;top:0;left:0;right:0;height:var(--hh);
  background:rgba(237,246,251,0.88);
  border-bottom:1px solid rgba(21,105,154,0.14);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;z-index:100;
}
.logo{display:flex;flex-direction:column;line-height:1.2;cursor:pointer;user-select:none}
.logo-sub{font-size:9px;color:var(--teal);letter-spacing:.22em;font-weight:500;text-transform:uppercase}
.logo-main{font-size:17px;font-weight:800;color:var(--ocean);letter-spacing:.04em}
.logo-icon{font-size:18px;margin-right:6px;vertical-align:middle}

/* ── Sticky bar ── */
.sticky-bar{
  position:sticky;top:var(--hh);z-index:90;
  background:rgba(237,246,251,0.85);
  border-bottom:1px solid var(--border);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
}
.year-nav{display:flex;gap:5px;padding:8px 16px 4px;overflow-x:auto;scrollbar-width:none}
.year-nav::-webkit-scrollbar{display:none}
.month-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:4px 14px 8px}

.year-btn,.month-btn{
  flex-shrink:0;background:rgba(255,255,255,0.5);
  border:1px solid var(--border);color:var(--muted);
  padding:4px 13px;border-radius:20px;cursor:pointer;
  font-size:12.5px;font-weight:600;transition:all .18s;white-space:nowrap;
}
.year-btn{font-size:13px}
.month-btn{padding:5px 4px;border-radius:8px;text-align:center;font-size:12px}
.year-btn.active,.month-btn.active{background:var(--ocean);border-color:var(--ocean);color:#fff}
.year-btn:not(.active):hover,.month-btn:not(.active):hover{
  background:rgba(21,105,154,0.1);border-color:rgba(21,105,154,0.3);color:var(--ocean)
}

/* ── Content ── */
.content{max-width:780px;margin:0 auto;padding:20px 16px 80px}

/* ── Calendar ── */
.cal-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;
}
.cal-month-label{font-size:15px;font-weight:700;color:var(--ocean)}
.cal-legend{display:flex;gap:10px;font-size:10px;color:var(--muted);align-items:center;flex-wrap:wrap}
.cal-legend span{display:flex;align-items:center;gap:3px}
.l-dot{width:6px;height:6px;border-radius:50%}
.cal-weekdays{
  display:grid;grid-template-columns:repeat(7,1fr);
  margin-bottom:3px;
}
.cal-wd{
  text-align:center;font-size:10px;font-weight:700;
  color:var(--muted);padding:4px 0;
}
.cal-wd:first-child{color:var(--coral)}
.cal-wd:last-child{color:var(--ocean)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:20px}
.cal-day{
  aspect-ratio:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  border-radius:8px;cursor:pointer;font-size:12px;
  position:relative;transition:background .15s;min-height:32px;padding:2px;
}
.cal-day:hover{background:rgba(21,105,154,0.1)}
.cal-day.today{background:var(--ocean);color:#fff;font-weight:700;box-shadow:0 0 10px rgba(21,105,154,0.3)}
.cal-day.other-month{color:rgba(22,40,56,0.18);cursor:default}
.cal-day.other-month:hover{background:none}
.cal-day.selected{background:rgba(21,105,154,0.14);border:1.5px solid var(--ocean);color:var(--ocean);font-weight:700}
.cal-day.today.selected{background:var(--ocean);border-color:var(--coral);color:#fff}
.cal-dots{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;margin-top:2px}
.cal-dot{width:5px;height:5px;border-radius:50%}
.dot-v{background:var(--coral)}
.dot-j{background:var(--teal)}

/* ── Section label ── */
.sec-label{
  font-size:11px;font-weight:700;color:var(--ocean);
  letter-spacing:.1em;text-transform:uppercase;
  padding-bottom:6px;border-bottom:1.5px solid rgba(21,105,154,0.18);
  margin-bottom:10px;
}
.ev-count{
  display:inline-block;background:var(--coral);color:#fff;
  border-radius:10px;padding:1px 8px;font-size:10px;font-weight:700;
  margin-left:8px;letter-spacing:0;text-transform:none;vertical-align:middle;
}

/* ── Event item (kujinews style adapted) ── */
.ev-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:11px 14px;
  background:var(--surface);
  border-radius:var(--r);border:1px solid var(--border);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  transition:all .22s;margin-bottom:7px;
  animation:fadeUp .3s ease both;
}
.ev-item:hover{
  background:var(--surface-h);border-color:var(--border-h);
  box-shadow:0 4px 20px rgba(21,105,154,0.12),0 1px 4px rgba(0,0,0,0.06);
  transform:translateY(-1px);
}
.ev-item.vtype{border-left:3px solid var(--coral)}
.ev-item.jtype{border-left:3px solid var(--teal)}

.ev-date{
  flex-shrink:0;width:54px;
  font-size:11px;color:var(--ocean);font-weight:700;
  text-align:center;line-height:1.4;padding-top:1px;
}
.ev-body{flex:1;min-width:0}
.ev-zh{
  font-size:13.5px;font-weight:700;color:var(--text);
  line-height:1.4;margin-bottom:3px;
  display:block;text-decoration:none;
}
.ev-zh:hover{color:var(--ocean)}
.ev-ja{font-size:11px;color:var(--muted)}
.ev-ja a{color:var(--muted);text-decoration:none}
.ev-ja a:hover{color:var(--teal);text-decoration:underline}
.ev-link{font-size:11px}
.ev-link a{color:var(--coral);text-decoration:none;font-weight:600}
.ev-link a:hover{text-decoration:underline}

.empty{text-align:center;padding:36px;color:var(--muted);font-size:13px}

/* ── Footer ── */
footer{
  text-align:center;padding:20px;font-size:11px;color:var(--muted);
  border-top:1px solid var(--border);
}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:380px){.cal-day{min-height:28px;font-size:11px}.logo-main{font-size:15px}}
</style>
</head>

<script>
const EVENTS = JSON.parse(document.getElementById('ev-data').textContent);

// index by date
const byDate = {};
EVENTS.forEach(e => {
  if (!byDate[e.date_start]) byDate[e.date_start] = [];
  byDate[e.date_start].push(e);
});

const WD = ['日','一','二','三','四','五','六'];
const MN = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

// collect all (year,month) with events
const months = [...new Set(EVENTS.map(e => e.date_start.slice(0,7)))].sort();
const years  = [...new Set(months.map(m => m.slice(0,4)))];

let cy, cm, selDate = null;

// ── Init year/month nav ──────────────────────────────────────────────
function buildNav() {
  const yn = document.getElementById('year-nav');
  const mg = document.getElementById('month-grid');
  yn.innerHTML = years.map(y =>
    `<button class="year-btn${y==cy?' active':''}" onclick="setYear('${y}')">${y}</button>`
  ).join('');

  // months for current year
  const myMonths = months.filter(m => m.startsWith(cy));
  const allM = Array.from({length:12},(_,i)=>i+1);
  mg.innerHTML = allM.map(m => {
    const key = cy+'-'+String(m).padStart(2,'0');
    const has = myMonths.includes(key);
    const active = m-1 == cm;
    return `<button class="month-btn${active?' active':''}${has?'':''}"
      onclick="${has?`setMonth(${m-1})`:'void(0)'}"
      style="${has?'':'opacity:.35;cursor:default'}">${m}月</button>`;
  }).join('');
}

function setYear(y) {
  cy = parseInt(y);
  // pick first available month in this year
  const first = months.find(m => m.startsWith(cy));
  cm = first ? parseInt(first.slice(5,7))-1 : 0;
  selDate = null;
  buildNav(); renderCal(); renderEvents();
}

function setMonth(m) {
  cm = m; selDate = null;
  buildNav(); renderCal(); renderEvents();
}

// ── Calendar ─────────────────────────────────────────────────────────
function renderCal() {
  const lbl = document.getElementById('cal-label');
  lbl.textContent = cy + '年' + MN[cm];

  const first = new Date(cy, cm, 1);
  const last  = new Date(cy, cm+1, 0);
  const now   = new Date();
  const dow   = first.getDay();

  let html = '';

  // prev month filler
  const prevLast = new Date(cy, cm, 0).getDate();
  for (let i = dow-1; i >= 0; i--)
    html += '<div class="cal-day other-month"><span>'+(prevLast-i)+'</span></div>';

  // current month
  for (let d = 1; d <= last.getDate(); d++) {
    const ds = cy+'-'+pad(cm+1)+'-'+pad(d);
    const isToday = d==now.getDate() && cm==now.getMonth() && cy==now.getFullYear();
    const isSel   = ds === selDate;
    const evs     = byDate[ds] || [];
    let cls = 'cal-day'+(isToday?' today':'')+(isSel?' selected':'');
    let dots = evs.slice(0,4).map(e =>
      '<div class="cal-dot '+(e.source==='okinawastory'?'dot-j':'dot-v')+'"></div>'
    ).join('');
    html += `<div class="${cls}" onclick="pickDay('${ds}')">
      <span>${d}</span>
      <div class="cal-dots">${dots}</div>
    </div>`;
  }

  // next month filler
  const fill = 42 - dow - last.getDate();
  for (let d = 1; d <= fill; d++)
    html += '<div class="cal-day other-month"><span>'+d+'</span></div>';

  document.getElementById('cal-grid').innerHTML = html;
}

function pickDay(ds) {
  selDate = selDate === ds ? null : ds;
  renderCal(); renderEvents();
  document.getElementById('ev-label').scrollIntoView({behavior:'smooth',block:'start'});
}

// ── Events ────────────────────────────────────────────────────────────
function pad(n) { return String(n).padStart(2,'0'); }

function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s+'T00:00:00');
  return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')';
}

function renderEvents() {
  const list  = document.getElementById('ev-list');
  const lbl   = document.getElementById('ev-label');
  const cnt   = document.getElementById('ev-count');
  const prefix = cy+'-'+pad(cm+1);

  const evs = selDate
    ? (byDate[selDate] || [])
    : EVENTS.filter(e => e.date_start && e.date_start.startsWith(prefix));

  lbl.childNodes[0].textContent = selDate ? fmtDate(selDate) : cy+'年'+MN[cm]+'活動';
  cnt.textContent = evs.length;

  if (!evs.length) {
    list.innerHTML = '<div class="empty">🌊 這天沒有活動</div>';
    return;
  }

  list.innerHTML = evs.map((e, i) => {
    const zh  = e.name_zh || e.name;
    const ja  = e.name;
    const isJ = e.source === 'okinawastory';
    const end = (e.date_end && e.date_end !== e.date_start)
      ? '～'+ (()=>{const d=new Date(e.date_end+'T00:00:00');return (d.getMonth()+1)+'/'+d.getDate()})()
      : '';
    const dtag = fmtDate(e.date_start) + end;

    const bodyLink = isJ && zh !== ja
      ? `<a class="ev-zh" href="${e.url}" target="_blank">${zh}</a>
         <div class="ev-ja"><a href="${e.url}" target="_blank">${ja}</a></div>`
      : `<a class="ev-zh" href="${e.url}" target="_blank">${zh}</a>`;

    return `<div class="ev-item ${isJ?'jtype':'vtype'}" style="animation-delay:${i*0.035}s">
      <div class="ev-date">${dtag}</div>
      <div class="ev-body">${bodyLink}</div>
    </div>`;
  }).join('');
}

// ── Init ──────────────────────────────────────────────────────────────
(function(){
  const now = new Date();
  cy = now.getFullYear(); cm = now.getMonth();
  // if current month has no events, jump to first month with events
  const prefix = cy+'-'+pad(cm+1);
  if (!EVENTS.some(e => e.date_start && e.date_start.startsWith(prefix)) && EVENTS.length) {
    const first = EVENTS[0].date_start;
    cy = parseInt(first.slice(0,4));
    cm = parseInt(first.slice(5,7))-1;
  }
  buildNav(); renderCal(); renderEvents();
})();
</script>
