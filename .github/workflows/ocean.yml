name: Okinawa Ocean Conditions

on:
  schedule:
    - cron: "0 */3 * * *"  # 每 3 小時一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch ocean conditions
        run: python ocean_crawler.py

      - name: Rebuild site
        run: python build.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet && exit 0
          git commit -m "chore: update ocean conditions [skip ci]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "推送被拒絕，rebase 到最新後重試（第 $i 次）"
            git pull --rebase origin main
            sleep $((RANDOM % 10 + 5))
          done
          echo "重試 5 次仍失敗" >&2
          exit 1
