  <section class="page-head">
    <div class="shell">
      <div class="eyebrow">Play Calendar</div>
      <h1>沖繩活動年曆</h1>
      <p>祭典、花火、季節限定與文化日，整理成一份可以點日期查的年曆。所有外部活動都保留原始來源。</p>
    </div>
  </section>

  <section class="explorer" id="calendar">
    <div class="shell">
      <div class="explorer-tools">
        <label class="explorer-search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m16 16 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="eventSearch" type="search" placeholder="搜尋活動、地區、文化關鍵字">
        </label>
        <div class="filter-tabs" role="group" aria-label="活動類型">
          <button class="filter-tab active" type="button" data-filter="all">全部</button>
          <button class="filter-tab" type="button" data-filter="activity">近期活動</button>
          <button class="filter-tab" type="button" data-filter="today_is">今天是…</button>
          <button class="filter-tab" type="button" data-filter="saved">已收藏</button>
        </div>
      </div>
      <div class="calendar-layout">
        <aside class="calendar-panel" aria-label="月份選擇">
          <div class="cal-nav">
            <button id="prevMonth" type="button" aria-label="上一個月">←</button>
            <div class="cal-title">
              <select id="yearSelect" aria-label="年份"></select>
              <select id="monthSelect" aria-label="月份"></select>
            </div>
            <button id="nextMonth" type="button" aria-label="下一個月">→</button>
          </div>
          <div class="weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
          <div class="cal-grid" id="calGrid"></div>
          <div class="cal-legend"><span><i></i>活動</span><span><i class="culture"></i>文化日</span></div>
        </aside>
        <div>
          <div class="event-panel-head"><h3 id="eventHeading">本月活動</h3><span class="event-count" id="eventCount">0 筆</span></div>
          <div class="event-list" id="eventList"></div>
          <button class="more-btn" id="moreBtn" type="button" hidden>再看一些</button>
        </div>
      </div>
    </div>
  </section>
